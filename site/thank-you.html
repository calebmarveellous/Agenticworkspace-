<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Book Is Ready</title>
<style>
  :root { --hotpink: #E8195B; --bg-pink: #FFD1DC; --black: #111111; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg-pink) 0%, #ffe9ee 100%);
    color: var(--black);
    text-align: center;
    padding: 20px;
  }
  .card {
    max-width: 480px;
    background: #fff;
    border-radius: 20px;
    padding: 44px 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
  }
  h1 { color: var(--hotpink); font-size: 26px; margin-bottom: 12px; }
  p { font-size: 16px; color: #444; line-height: 1.5; }
  .download-btn {
    display: inline-block;
    margin-top: 24px;
    background: var(--hotpink);
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    text-decoration: none;
    padding: 16px 36px;
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(232,25,91,0.4);
  }
  .ref { margin-top: 20px; font-size: 12px; color: #999; word-break: break-all; }
  .warning {
    margin-top: 28px;
    font-size: 13px;
    color: #a15b00;
    background: #fff6e5;
    border: 1px solid #ffe1a8;
    border-radius: 10px;
    padding: 12px 14px;
    text-align: left;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Payment Received. Diagnosis Incoming.</h1>
    <p id="mainMsg">Thanks for your purchase! Your copy of <strong>The Group Chat Diagnostic Manual</strong> is ready.</p>
    <a class="download-btn" href="assets/the-group-chat-diagnostic-manual.pdf" download>Download Your Book (PDF)</a>
    <div class="ref" id="refLine"></div>
  </div>
  <!--
    SITE OWNER NOTE (not shown to customers):
    This page currently grants the download to anyone who lands here with any reference —
    payment is verified client-side only, via Paystack's callback. Someone could reach this
    page directly without paying. Before relying on this for real sales, add a server-side
    check: call Paystack's GET /transaction/verify/:reference endpoint from a backend or
    serverless function using your SECRET key (never expose the secret key in this file or
    commit it to the repo), and only reveal/serve the download if verification confirms a
    successful charge matching the expected amount.
  -->

  <script>
    const params = new URLSearchParams(window.location.search);
    const ref = params.get("ref");
    const email = params.get("email");
    if (ref) {
      document.getElementById("refLine").textContent = "Reference: " + ref + (email ? " · " + email : "");
    } else {
      document.getElementById("mainMsg").textContent =
        "No payment reference found. If you haven't purchased yet, please go back and buy the book first.";
    }
  </script>
</body>
</html>
