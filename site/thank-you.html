<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Book Is Ready</title>
<style>
  :root { --hotpink: #E8195B; --bg-pink: #FFD1DC; --black: #111111; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg-pink) 0%, #ffe9ee 100%);
    color: var(--black);
    text-align: center;
    padding: 20px;
  }
  .card {
    max-width: 480px;
    background: #fff;
    border-radius: 20px;
    padding: 44px 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
  }
  h1 { color: var(--hotpink); font-size: 24px; margin-bottom: 12px; }
  p { font-size: 16px; color: #444; line-height: 1.5; }
  .download-btn {
    display: none;
    margin-top: 24px;
    background: var(--hotpink);
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    text-decoration: none;
    padding: 16px 36px;
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(232,25,91,0.4);
  }
  .ref { margin-top: 20px; font-size: 12px; color: #999; word-break: break-all; }
  .spinner {
    margin: 20px auto 0;
    width: 28px;
    height: 28px;
    border: 3px solid #ffd6e2;
    border-top-color: var(--hotpink);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <h1 id="mainTitle">Verifying your payment…</h1>
    <p id="mainMsg">Hang tight — we're confirming your purchase with Paystack.</p>
    <div class="spinner" id="spinner"></div>
    <a class="download-btn" id="downloadBtn" href="#" download>Download Your Book (PDF)</a>
    <div class="ref" id="refLine"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ref = params.get("ref");

    const titleEl = document.getElementById("mainTitle");
    const msgEl = document.getElementById("mainMsg");
    const spinnerEl = document.getElementById("spinner");
    const btnEl = document.getElementById("downloadBtn");
    const refEl = document.getElementById("refLine");

    async function verify() {
      if (!ref) {
        spinnerEl.style.display = "none";
        titleEl.textContent = "No payment found";
        msgEl.textContent = "If you haven't purchased yet, please go back and buy the book first.";
        return;
      }
      refEl.textContent = "Reference: " + ref;

      try {
        const res = await fetch("/api/verify?reference=" + encodeURIComponent(ref));
        const data = await res.json();
        spinnerEl.style.display = "none";

        if (data.ok) {
          titleEl.textContent = "Payment Received. Diagnosis Incoming.";
          msgEl.innerHTML = "Thanks for your purchase! Your copy of <strong>The Group Chat Diagnostic Manual</strong> is ready. We've also emailed you the link.";
          btnEl.href = data.downloadUrl;
          btnEl.style.display = "inline-block";
        } else {
          titleEl.textContent = "We couldn't verify this payment";
          msgEl.textContent = "If you just paid, wait a few seconds and refresh this page. Otherwise, contact support with the reference below.";
        }
      } catch (e) {
        spinnerEl.style.display = "none";
        titleEl.textContent = "Verification error";
        msgEl.textContent = "Something went wrong checking your payment. Please refresh, or contact support with the reference below.";
      }
    }

    verify();
  </script>
</body>
</html>
